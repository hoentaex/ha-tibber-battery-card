name: Release

# Pushing a tag vX.Y.Z builds the card and attaches ha-tibber-battery-card.js to the GitHub release,
# with that version's CHANGELOG.md section as release notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  release:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build and notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$(node -p "require('./package.json').version")" || { echo "::error::tag $GITHUB_REF_NAME does not match package.json"; exit 1; }
          npm ci
          npm run build
          awk -v v="$VERSION" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/ha-tibber-battery-card.js
          body_path: notes.md
          make_latest: true
