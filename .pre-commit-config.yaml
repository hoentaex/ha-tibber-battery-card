repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
  - repo: https://github.com/biomejs/pre-commit
    rev: "v2.6.4"
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.6.4"]
